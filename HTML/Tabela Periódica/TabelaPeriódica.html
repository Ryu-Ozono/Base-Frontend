<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabea Periódica</title>

    <style>
        /* --- CSS:Dfeine a aparência e o layout --- */

        body{
            background-color: #0f172a; /* cor de fundo escura */
            color: #f8fafc; /* code de texto clara */
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Configuração de Grid da Tabela Periódica */

        .tabela-periodica {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            grid-template-columns: repeat(7, 80px);
            gap: 5px;
            width: 100%;
            max-width: 1000px;

        }

        .elemento {
            grid-column: var(--col);
            grid-row: var(--row);

            background: #1e293b;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column; /* Coloca o número do símbolo */
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;       /* Suaviza a animação do hover */
        }

        /* Efeito para passar mouse */

        .elemento:hover {
            transform: scale(1.2); /* Aumenta o tamanho em 10% */ 
            z-index: 10;
            border-color: #38bdf8;
        }

        .simbolo {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        
        .numero {
            font-size: 0.7;
            color: #94a3b8;
        }
        /* Estilização do painel onde as informações aparecem */
        #detalhes {
            margin-top: 30px;
            padding: 15px;
            border: 2px #38bdfd;
            border-radius: 8px;
            min-width: 300px;
            text-align: center;
        }

        

    </style>

</head>
<body>
    
<h1>Tabela Periódica interativa</h1>

<div class="tabela-periodica">
    <div class="elemento" style="--col: 1; --row: 1;"
        data-nome ="hidrogenio" data-massa ="1.008">
            <span class="numero">1</span>
            <span class="simbolo">H</span>
    </div>

    <div class="elemento" style="--col: 18; --row: 1;"
        data-nome="Hélio" data-massa ="4.002">
            <span class="numero">2</span>
            <span class="simbolo">He</span>
    </div>

    <div class="elemento" style="--col: 1; --row: 4;"
        data-nome="Hélio" data-massa="39.098">
            <span class="numero">19</span>
            <span class="simbolo">K</span>
    </div>

    <div class="elemento" style="--col: 8; --row: 4;"
        data-nome="Hélio" data-massa ="55.845">
            <span class="numero">26</span>
            <span class="simbolo">F</span>
    </div>
</div>

    <div id="detalhes">Passe o mouse sobre o elemento!</div>

    <script>
        /* ... JavaScript: Controla  a interatividade ... */

        //1.Selecionamos todos os elementos químics da página

        const blocos = document.querySelectorAll('.elemento');

        //2.Selecionamos a caixa onde o texto vai aparecer

        const caixaInfo = document.getElementById('detalhes');

        //3.Para cada elemento, adicionamos uma "escuta" de evento
        blocos.forEach(item =>{

            //Quando o mouse entra no quadro
            item.addEventListener('mouseenter', () => {
                // Pegamos os valores que guardams nos atributos 'data'
                const nome = item.getAttribute('data-nome');
                const massa = item.getAttribute('data-massa');

                // Atualizamos o texto na caixa de detalhes
                caixaInfo.innerHTML = '<strong>${nome}</strong> - Massa: ${massa}';

            });

            //Quando mouse sai do quadro
            item.addEventListener('mouseleave', () => {
                caixaInfo.innerText = "Passe o mouse sobre o elemento";
            });
        
        });
    </script>

</body>
</html>
